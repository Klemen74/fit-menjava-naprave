name: Zgradi APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FIT-menjava-naprave.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FIT-menjava-naprave-apk
          path: FIT-menjava-naprave.apk

      - name: Publish APK to branch "apk"
        run: |
          mkdir out && cp FIT-menjava-naprave.apk out/
          cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add FIT-menjava-naprave.apk
          git commit -q -m "APK iz ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
